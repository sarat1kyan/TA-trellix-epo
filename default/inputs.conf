# Trellix ePO Modular Input Configuration
# Configure your ePO server settings first via the Setup UI or in ta_trellix_epo_settings.conf
# Then enable the inputs you need by setting disabled = 0
#
# To enable an input:
#   1. Copy this stanza to local/inputs.conf
#   2. Set disabled = 0
#   3. Adjust interval and index as needed

# ============================================
# Threat Events - Real-time threat detection
# Recommended interval: 300 seconds (5 minutes)
# ============================================
[trellix_epo://threat_events]
disabled = 1
interval = 300
index = main
sourcetype = trellix_epo:threat_events
input_type = threat_events

# ============================================
# Malware Detections - Malware identification
# Recommended interval: 300 seconds (5 minutes)
# ============================================
[trellix_epo://malware_detections]
disabled = 1
interval = 300
index = main
sourcetype = trellix_epo:malware_detections
input_type = malware_detections

# ============================================
# Host Status - System health information
# Recommended interval: 3600 seconds (1 hour)
# ============================================
[trellix_epo://host_status]
disabled = 1
interval = 3600
index = main
sourcetype = trellix_epo:host_status
input_type = host_status

# ============================================
# Agent Status - ePO agent connectivity
# Recommended interval: 3600 seconds (1 hour)
# ============================================
[trellix_epo://agent_status]
disabled = 1
interval = 3600
index = main
sourcetype = trellix_epo:agent_status
input_type = agent_status

# ============================================
# Policy Compliance - Policy violations
# Recommended interval: 7200 seconds (2 hours)
# ============================================
[trellix_epo://policy_compliance]
disabled = 1
interval = 7200
index = main
sourcetype = trellix_epo:policy_compliance
input_type = policy_compliance

# ============================================
# Quarantine Events - Quarantine actions
# Recommended interval: 600 seconds (10 minutes)
# ============================================
[trellix_epo://quarantine_events]
disabled = 1
interval = 600
index = main
sourcetype = trellix_epo:quarantine_events
input_type = quarantine_events

# ============================================
# Updates/DAT Versions - Signature updates
# Recommended interval: 14400 seconds (4 hours)
# ============================================
[trellix_epo://updates]
disabled = 1
interval = 14400
index = main
sourcetype = trellix_epo:updates
input_type = updates

# ============================================
# User Actions - Audit logs
# Recommended interval: 600 seconds (10 minutes)
# ============================================
[trellix_epo://user_actions]
disabled = 1
interval = 600
index = main
sourcetype = trellix_epo:user_actions
input_type = user_actions
