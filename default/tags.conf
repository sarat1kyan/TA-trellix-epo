# Trellix ePO Tags Configuration
# Maps event types to CIM data model tags

# ============================================
# Malware Data Model Tags
# ============================================
[eventtype=trellix_epo_malware]
malware = enabled
attack = enabled
endpoint = enabled

[eventtype=trellix_epo_malware_attack]
malware = enabled
attack = enabled

# ============================================
# Intrusion Detection Data Model Tags
# ============================================
[eventtype=trellix_epo_ids]
ids = enabled
attack = enabled

[eventtype=trellix_epo_ids_attack]
ids = enabled
attack = enabled

# ============================================
# Endpoint Data Model Tags
# ============================================
[eventtype=trellix_epo_endpoint]
endpoint = enabled
inventory = enabled

[eventtype=trellix_epo_endpoint_services]
endpoint = enabled
services = enabled

# ============================================
# Change Data Model Tags
# ============================================
[eventtype=trellix_epo_change]
change = enabled
audit = enabled

[eventtype=trellix_epo_change_audit]
change = enabled
audit = enabled
policy = enabled

# ============================================
# Authentication Data Model Tags
# ============================================
[eventtype=trellix_epo_authentication]
authentication = enabled

[eventtype=trellix_epo_authentication_failure]
authentication = enabled
failure = enabled

# ============================================
# Update Data Model Tags
# ============================================
[eventtype=trellix_epo_update]
update = enabled
endpoint = enabled

# ============================================
# Quarantine Tags
# ============================================
[eventtype=trellix_epo_quarantine]
malware = enabled
endpoint = enabled

# ============================================
# Audit Tags
# ============================================
[eventtype=trellix_epo_audit]
audit = enabled

[eventtype=trellix_epo_audit_admin]
audit = enabled
privileged = enabled

# ============================================
# Syslog-based Tags
# ============================================
[eventtype=trellix_epo_syslog_threat]
ids = enabled
attack = enabled
