# Trellix ePO CIM Normalization Transforms
# Maps ePO events to Common Information Model (CIM) fields

# Threat Events -> Intrusion_Detection
[trellix_epo_threat_to_ids]
REGEX = (?i)"threatType"\s*:\s*"([^"]+)"|"severity"\s*:\s*"([^"]+)"|"detectionId"\s*:\s*"?([^",}]+)
FORMAT = threat_type::$1 severity::$2 detection_id::$3
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Intrusion_Detection

[trellix_epo_threat_cim_fields]
REGEX = 
FORMAT = 
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Intrusion_Detection

# Malware Detections -> Malware
[trellix_epo_malware_to_malware]
REGEX = (?i)"malwareType"\s*:\s*"([^"]+)"|"fileHash"\s*:\s*"([^"]+)"|"filePath"\s*:\s*"([^"]+)
FORMAT = malware_type::$1 file_hash::$2 file_path::$3
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Malware

[trellix_epo_malware_cim_fields]
REGEX = 
FORMAT = 
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Malware

# Host Status -> Endpoint
[trellix_epo_host_to_endpoint]
REGEX = 
FORMAT = 
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Endpoint

# Policy Compliance -> Change
[trellix_epo_policy_to_change]
REGEX = (?i)"policyName"\s*:\s*"([^"]+)"|"complianceStatus"\s*:\s*"([^"]+)"|"violationCount"\s*:\s*"?([^",}]+)
FORMAT = policy_name::$1 compliance_status::$2 violation_count::$3
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Change

# User Actions -> Audit
[trellix_epo_user_to_audit]
REGEX = (?i)"action"\s*:\s*"([^"]+)"|"result"\s*:\s*"([^"]+)"|"userName"\s*:\s*"([^"]+)
FORMAT = action::$1 result::$2 user::$3
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Audit

# Field Extractions
[threat_extractions]
REGEX = "detectionId"\s*:\s*"?([^",}]+)
FORMAT = detection_id::"$1"
REGEX = "threatName"\s*:\s*"([^"]+)
FORMAT = threat_name::"$1"
REGEX = "threatType"\s*:\s*"([^"]+)
FORMAT = threat_type::"$1"
REGEX = "severity"\s*:\s*"([^"]+)
FORMAT = severity::"$1"
REGEX = "detectedUTC"\s*:\s*"?([^",}]+)
FORMAT = detected_utc::"$1"
REGEX = "computerName"\s*:\s*"([^"]+)
FORMAT = computer_name::"$1"
REGEX = "ipAddress"\s*:\s*"([^"]+)
FORMAT = ip_address::"$1"

[malware_extractions]
REGEX = "malwareName"\s*:\s*"([^"]+)
FORMAT = malware_name::"$1"
REGEX = "malwareType"\s*:\s*"([^"]+)
FORMAT = malware_type::"$1"
REGEX = "filePath"\s*:\s*"([^"]+)
FORMAT = file_path::"$1"
REGEX = "fileHash"\s*:\s*"([^"]+)
FORMAT = file_hash::"$1"
REGEX = "threatId"\s*:\s*"?([^",}]+)
FORMAT = threat_id::"$1"

# CIM Field Mappings
[cim_intrusion_detection]
REGEX = "severity"\s*:\s*"([^"]+)
FORMAT = severity::"$1"
REGEX = "detectionId"\s*:\s*"?([^",}]+)
FORMAT = signature_id::"$1"
REGEX = "threatName"\s*:\s*"([^"]+)
FORMAT = signature::"$1"
REGEX = "computerName"\s*:\s*"([^"]+)
FORMAT = dest_host::"$1"
REGEX = "ipAddress"\s*:\s*"([^"]+)
FORMAT = dest_ip::"$1"

[cim_malware]
REGEX = "malwareName"\s*:\s*"([^"]+)
FORMAT = malware_name::"$1"
REGEX = "fileHash"\s*:\s*"([^"]+)
FORMAT = file_hash::"$1"
REGEX = "filePath"\s*:\s*"([^"]+)
FORMAT = file_path::"$1"
REGEX = "computerName"\s*:\s*"([^"]+)
FORMAT = dest_host::"$1"

[cim_endpoint]
REGEX = "computerName"\s*:\s*"([^"]+)
FORMAT = dest_host::"$1"
REGEX = "ipAddress"\s*:\s*"([^"]+)
FORMAT = dest_ip::"$1"
REGEX = "operatingSystem"\s*:\s*"([^"]+)
FORMAT = dest_os::"$1"
REGEX = "agentVersion"\s*:\s*"([^"]+)
FORMAT = dest_os_version::"$1"

[cim_audit]
REGEX = "userName"\s*:\s*"([^"]+)
FORMAT = user::"$1"
REGEX = "action"\s*:\s*"([^"]+)
FORMAT = action::"$1"
REGEX = "result"\s*:\s*"([^"]+)
FORMAT = result::"$1"
REGEX = "sourceIP"\s*:\s*"([^"]+)
FORMAT = src_ip::"$1"

# CIM Normalization for Syslog-based Threat Events
[cim_syslog_intrusion_detection]
REGEX = (?:threat[_\s]?name|malware)[:=]\s*["']?([^"',\n]+)["']?
FORMAT = signature::"$1"
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Intrusion_Detection

[cim_syslog_malware]
REGEX = (?:threat[_\s]?name|malware)[:=]\s*["']?([^"',\n]+)["']?
FORMAT = malware_name::"$1"
REGEX = (?:hash|md5|sha1|sha256)[:=]\s*([a-fA-F0-9]{32,64})
FORMAT = file_hash::"$1"
REGEX = (?:file|path|filepath)[:=]\s*["']?([^"',\n]+)["']?
FORMAT = file_path::"$1"
DEST_KEY = MetaData:CIM
WRITE_META = true
DEFAULT_VALUE = Malware

